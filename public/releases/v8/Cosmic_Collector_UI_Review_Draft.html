:root{color-scheme:dark;--gold:#f0d3a0;--ink:#fff0d9;--mute:#d3bfa7;--edge:#a67d59;--base:#291716;--page:#190f12;--panel:#3e2923;--paper:#efd8b5;--dark:#39251f;--mint:#bddec7;--no:#ffc1ae}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0,#52312b,transparent 68%),var(--page);color:var(--ink);font:16px/1.5 ReviewSC,system-ui,"Microsoft Yahei","Noto Sans SC",sans-serif}h1,h2,p,figure{margin:0}button{font:inherit;cursor:pointer;color:inherit;min-height:44px;background:#493029;border:1px solid var(--edge);border-radius:5px;padding:7px 12px}button:hover:not(:disabled){filter:brightness(1.18)}button:disabled{cursor:default;opacity:.62}button:focus-visible{outline:3px solid #fff0bd;outline-offset:3px}button[aria-pressed=true]{background:#644332;border-color:#ffe1a2;color:#fff4d7;box-shadow:inset 0 -2px #e7ba7e}.primary{color:#35221b;background:var(--gold);font-weight:700}.quiet{background:#2b2020}.round{border-radius:50%;padding:0;width:46px}small{font-size:.82rem;color:var(--mute)}[hidden]{display:none!important}
.shell{width:min(1210px,100%);margin:auto;padding:16px clamp(9px,3vw,34px) 32px}.review{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.review b{color:var(--gold);letter-spacing:.08em}.review nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.screen{border:1px solid #987355;background:#321f1c;border-radius:9px;overflow:hidden;box-shadow:0 22px 60px #0d0709b0}
.gamebar{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;gap:9px;flex-wrap:wrap;border-bottom:1px solid #986d4b;background:linear-gradient(90deg,#3c241f,#291919)}.identity{display:flex;align-items:center;gap:10px}.diamond{font:24px Georgia;color:var(--gold)}h1{font:700 clamp(1.15rem,3vw,1.62rem)/1.2 Georgia,ReviewSC,"Songti SC",SimSun,serif;color:#ffe8bd}.badge{display:inline-flex;align-items:center;min-height:34px;border:1px solid #90674d;padding:3px 9px;border-radius:5px;background:#2c1c1a;color:#f3d9aa}.gamebar .row{gap:6px}.gamebar button{min-height:38px}
.stage{position:relative;isolation:isolate;aspect-ratio:1672/941;overflow:hidden;background:#231d24}.stage>img{display:block;width:100%;height:100%;object-fit:contain}.hotspot{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:grid;place-items:center;width:48px;height:48px;padding:0;border:2px solid #ffe0a4;border-radius:50%;background:#2f2321ed;color:#ffeac0;box-shadow:0 0 0 4px #332221ab,0 0 26px #e9a75196;font:24px/1 Georgia}.hotspot .tag{display:none;position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);padding:3px 8px;background:#2a1c1a;border:1px solid var(--edge);border-radius:5px;color:var(--ink);font:500 .83rem/1.4 ReviewSC,system-ui;white-space:nowrap}.hotspot:is(:hover,:focus-visible,.active) .tag{display:block}.window-star{position:absolute;left:16.1%;top:43%;width:22px;height:22px;filter:drop-shadow(0 0 8px #fff0a4);color:#fff4b0;font-size:26px;line-height:1;transform:translate(-50%,-50%)}.hotspot.done::after{content:'✓';position:absolute;right:-6px;top:-6px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#31513d;color:#fff;font:700 12px system-ui}.fieldtools{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#39251f;border-top:1px solid #a07152}.fieldtools .row{gap:6px}.actionchip{padding:5px 8px;min-height:40px}.paper{background:var(--paper);color:var(--dark);border:1px solid #b88c5e;border-radius:6px}.paper small{color:#654539}.paper button{color:#fff0d9}.paper button.primary{color:var(--dark)}
.workbench{display:grid;grid-template-columns:minmax(160px,1fr) minmax(220px,1.1fr);gap:13px;padding:13px 14px;border-top:1px solid #ac7d59}.bench{padding:12px;display:grid;gap:8px;justify-items:start}.bench h2,.specimen h2{font-size:1rem}.diagram{display:grid;place-items:center;width:100%;height:62px;position:relative;background:#b88a5f40;border-radius:4px}.diagram.shape::before{content:'';position:absolute;width:56px;height:43px;border-left:4px solid #966638;border-right:4px solid #966638}.diagram svg{width:42px;height:42px;overflow:visible;color:#77513c}.diagram.nofit svg{width:65px;color:#963b30}.diagram.folded svg path:last-child{opacity:1}.diagram svg path:last-child{opacity:0}.specimen{display:grid;align-content:start;gap:6px}.samplelist{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.samplelist button{padding:6px 3px}.sample-icon{display:block;font-size:1.45rem;line-height:1.2}.samplelist small{display:block}.tick{color:var(--mint)}.cross{color:var(--no)}.benchstatus{font-size:.88rem;min-height:1.5em}
.shelf{position:absolute;left:22.3%;top:29.4%;width:46.9%;height:31.7%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(2px,.6vw,9px);padding:3px;border:2px solid #b77d4c;background:#80502f;box-shadow:0 2px 12px #30181188}.slot{min-width:0;min-height:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 75%,#865532,#392319);border:1px solid #b47b4f;box-shadow:inset 0 3px 8px #2d1a15c0}.slot.empty{background:#42271c}.slot.empty::after{content:'·';color:#e8b681}.slot svg{width:62%;height:auto;max-height:74%}.item{display:inline-block;width:25px;height:25px;vertical-align:middle}.orders{position:absolute;top:5%;left:3%;padding:8px 11px;box-shadow:0 4px 14px #2618176b}.orders b{display:block;font-size:.85rem}.orders .row{gap:3px 8px}.orders span{white-space:nowrap;font-size:.88rem}.counter{padding:11px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px 15px;align-items:center}.modebox{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.modebox button{padding:6px;line-height:1.35;text-align:left}.modebox strong,.modebox small{display:block}.modebox small{margin-top:2px}.status{min-height:24px}.checkout{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;padding:12px 14px}.payment{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;text-align:center}.payment b{display:block;font:700 1.35rem Georgia}.coins{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.coins button[data-coin]{border-radius:50%;width:45px;height:45px;padding:0;background:#c79458;color:#332018;font-weight:bold}.coinstatus{min-height:25px}.note{padding-top:10px;color:#d4bca0;font-size:.86rem}.fallback{position:static;display:none}
dialog{border:1px solid var(--edge);border-radius:7px;color:var(--ink);background:#3e2720;width:min(calc(100% - 28px),500px);padding:17px}dialog::backdrop{background:#1c1012c7}dialog h2{font-size:1.18rem}dialog p{margin:9px 0 15px}
@media(max-width:650px){.shell{padding-top:9px}.review nav{width:100%}.review nav button{flex:1}.gamebar{padding:7px 9px}.identity{gap:4px}.stage{aspect-ratio:1672/941}.hotspot{width:44px;height:44px;font-size:20px}.hotspot .tag{display:none!important}.workbench,.checkout{grid-template-columns:1fr}.shelf{padding:1px;gap:2px}.orders{font-size:.75rem;top:4%;padding:3px 5px}.orders .item{width:15px;height:15px}.orders b,.orders span{font-size:.72rem}.counter{grid-template-columns:1fr}.modebox{grid-column:auto}.counter .row{justify-content:space-between}.modebox small{font-size:.72rem}.fieldtools{padding:8px}.gamebar button,.actionchip{min-height:44px}}
</style>

<dialog id="detail" aria-labelledby="detailTitle"><h2 id="detailTitle"></h2><p id="detailText"></p><form method="dialog"><button class="primary">合上</button></form></dialog>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const shapes={
 candy:'<path fill="#d2c4a7" d="M3 22l6 2 1 11-8 2 4-8zM44 22l-6 2-1 11 9 2-4-8z"/><path fill="#f5be66" stroke="#ffe1a0" stroke-width="2" d="M24 5l5 13 14 1-10 9 3 13-12-7-12 7 3-13-10-9 14-1z"/>',
 paper:'<path fill="#f6d7a7" d="M24 3l5 14 15 2-11 9 4 15-13-8-13 8 4-15L4 19l15-2z"/><path fill="#b88760" d="M24 3v21L44 19l-11 9 4 15-13-8V24l-13 19 4-15L4 19l20 5z" opacity=".68"/>',
 moon:'<path fill="#f0bb69" stroke="#ffe2a7" stroke-width="2" d="M30 4c-18-4-30 15-21 31 8 14 29 11 35-3-16 6-29-12-14-28z"/>'};
const glyph=(k,c='item')=>'<svg class="'+c+'" viewBox="0 0 48 48" aria-hidden="true">'+shapes[k]+'</svg>';
const names=['叶纹','羽纹','花纹'], signs=['❧','⌁','✿'];
let selected=0, bench='', evidence=[{}, {}, {}],coins=[],mode='plain',filled=false,paid=0;
const actionNames={shape:'试装木框',girl:'莉丝',fold:'折纸台'};
const demo=[["candy",3,9,12],["paper",1,4,6],["moon",2,10,15]];
function show(view){for(const k of ['explore','shop','sale'])$('#'+k).hidden=k!==view;for(const el of $$('.review [data-view]'))el.setAttribute('aria-pressed',el.dataset.view===view);if(view==='sale')drawSale();window.scrollTo(0,0)}
function drawBench(){
 const t=evidence[selected],labels={shape:'试装',girl:'看记录',fold:'压折'}, yes=(v)=>v===undefined?'·':v?'<span class="tick">✓</span>':'<span class="cross">×</span>';
 $('#testCount').textContent='核对 '+Object.keys(t).length+' / 2';
 for(const el of $$('[data-bench]')){const k=el.dataset.bench;el.classList.toggle('active',k===bench);el.classList.toggle('done',t[k]!==undefined);el.setAttribute('aria-pressed',k===bench);}
 const area=$('#workbench');area.hidden=!bench;if(!bench)return;
 let diagram=bench==='shape'?'<svg viewBox="0 0 48 48"><path fill="currentColor" d="M24 2l6 15 16 2-12 10 4 17-14-9-14 9 4-17L2 19l16-2z"/><path d=""/></svg>':'<svg viewBox="0 0 48 48"><path fill="#ad774d" d="M7 7h34v34H7z"/><path stroke="#fff0c8" stroke-width="3" d="M7 41L41 7"/></svg>';
 area.innerHTML='<div class="bench paper"><h2>'+actionNames[bench]+'</h2><div class="diagram '+bench+(bench==='shape'&&t.shape===false?' nofit':'')+(bench==='fold'&&t.fold===true?' folded':'')+'">'+(bench==='girl'?'❧　✓　⌁　✓　✿　×':diagram)+'</div><button class="primary" data-test>'+labels[bench]+'</button></div><div class="specimen"><h2>样品</h2><div class="samplelist">'+names.map((n,i)=>'<button data-sample="'+i+'" aria-pressed="'+(i===selected)+'"><span class="sample-icon">'+signs[i]+'</span>'+n+'<small>▯ '+yes(evidence[i].shape)+'　◇ '+yes(evidence[i].fold)+'</small></button>').join('')+'</div><div class="row"><button class="primary" data-deliver '+(Object.keys(t).length===2?'':'disabled')+'>交付</button><button class="quiet" data-collapse>收起</button></div></div>';
}
function drawShop(){
 const goods=['candy','candy','candy','candy','paper','paper','paper','moon',...(filled?['paper','moon']:[])];
 $('#shelf').innerHTML=Array.from({length:10},(_,i)=>'<div class="slot '+(goods[i]?'':'empty')+'">'+(goods[i]?glyph(goods[i]):'')+'</div>').join('');
 $('#order').innerHTML=[['candy',3],['paper',1],['moon',2]].map(([k,n])=>'<span>'+glyph(k)+' × '+n+'</span>').join('');
 $('#cash').textContent='◎ '+(filled?45:50);$('#shelfCount').textContent='货架 '+goods.length+' / 10';$('#stock').disabled=filled;
 $('#stock').textContent=filled?'✓ 已上架':'补齐 · 5 币';
 for(const b of $$('[data-mode]'))b.setAttribute('aria-pressed',b.dataset.mode===mode);
 const note=!filled?'还差 2 件':mode==='local'?'拼单还差 1 颗星星糖':mode==='theme'?'可开门 · 陈列费 2 币':'✓ 可以开门';
 $('#openShop').disabled=!filled||mode==='local';$('#shopStatus').textContent=note;
}
function drawSale(){
 const finished=paid===demo.length, [kind,num,due,tender]=demo[Math.min(paid,demo.length-1)];
 $('#saleIndex').textContent=finished?'✓ 已结算':'客人 '+(paid+1)+' / 3';$('#saleOrder').innerHTML=finished?'三笔订单已结清':glyph(kind)+' × '+num;
 $('#payment').innerHTML=finished?'<div><span>营业额</span><b>23</b></div><div><span>成本</span><b>14</b></div><div><span>毛利</span><b>9</b></div>':[['应收',due],['实收',tender],['应找',tender-due]].map(([k,v])=>'<div><span>'+k+'</span><b>'+v+'</b></div>').join('');
 const value=coins.reduce((a,b)=>a+b,0);$('#coinStatus').textContent=finished?'打烊小票':'已选 '+value+' / '+(tender-due);
 $('#pay').disabled=finished||value!==tender-due;$('#undo').disabled=!coins.length;$('#fast').disabled=finished;$$('[data-coin]').forEach(b=>b.disabled=finished);
}
const help={letter:['玛德琳的信','「给莉丝留颗能夹进窗槽、也能折起来的星。」'],hint:['看两个地方','先把纸样试进木框，再看看它压下去会不会留下折痕。两个地方可以任意先去。'],ledger:['今晚的账簿','普通保留现金。拼单多卖两颗糖，净增 2 币。橱窗付 2 币，今晚到访率 50%，成单净增 6 币。']};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view){show(b.dataset.view);return;}
 if(b.dataset.info){const [title,copy]=help[b.dataset.info];$('#detailTitle').textContent=title;$('#detailText').textContent=copy;$('#detail').showModal();return;}
 if(b.dataset.bench){bench=b.dataset.bench;drawBench();if(b.classList.contains('hotspot'))$('#workbench').scrollIntoView({block:'nearest'});return;}
 if(b.hasAttribute('data-collapse')){const key=bench;bench='';drawBench();$('.actionchip[data-bench="'+key+'"]').focus();return;}
 if(b.dataset.sample!==undefined){selected=+b.dataset.sample;drawBench();$('[data-sample="'+selected+'"]').focus();return;}
 if(b.hasAttribute('data-test')){
  if(bench==='girl'){for(let i=0;i<3;i++)evidence[i].shape=i!==2;$('#questStatus').textContent='✓ 已记录莉丝的试装结果';}
  else{const ok=bench==='shape'?selected!==2:selected!==1;evidence[selected][bench]=ok;$('#questStatus').textContent=bench==='shape'?(ok?'✓ 贴合木槽':'× 木槽太窄'):(ok?'✓ 留下折痕':'× 样片弹回');}
  drawBench();$('[data-test]').focus();return;
 }
 if(b.hasAttribute('data-deliver')){if(selected===0)$('#windowStar').hidden=false;$('#questStatus').textContent=selected===0?'✓ 纸星已挂到窗边':'× 还要同时符合窗宽和折痕';return;}
 if(b.dataset.mode){mode=b.dataset.mode;drawShop();return;}
 if(b.id==='stock'){filled=true;drawShop();$('#shopStatus').tabIndex=-1;$('#shopStatus').focus();return;}
 if(b.id==='openShop'){paid=0;coins=[];show('sale');return;}
 if(b.dataset.coin)coins.push(+b.dataset.coin);
 else if(b.id==='undo')coins.pop();
 else if(b.id==='pay'||b.id==='fast'){paid++;coins=[];}
 else return;
 drawSale();
});
drawBench();drawShop();drawSale();
</script>
</body></html>
