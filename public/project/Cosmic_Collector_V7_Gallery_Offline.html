<title>宇宙收藏家 · 街角回响 | V7 画册版</title>
<style>
:root{color-scheme:dark;--bg:#101526;--panel:#1b2339;--deep:#141b2d;--line:#3a4560;--ink:#fbf1da;--sub:#bac4db;--gold:#f6d897;--teal:#a1e2cc;--rose:#ffb6b1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 82% 3%,#292742 0,transparent 42%),var(--bg);font:16px/1.6 system-ui,"Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--ink)}
button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);color:var(--ink);background:#293550;border-radius:10px;padding:.5rem .8rem;transition:background .16s,transform .16s}button:hover:not(:disabled){background:#3b4b6a}button:active:not(:disabled){transform:translateY(1px)}button:disabled{opacity:.46;cursor:not-allowed}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button.primary{background:var(--gold);color:#272033;border-color:transparent;font-weight:750}button.primary:hover:not(:disabled){background:#ffebb9}button.quiet{background:transparent;color:var(--sub)}button.chosen{border-color:var(--teal);background:#244745}
.top{position:sticky;top:0;z-index:5;background:#141a2bf2;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.top-inner{max-width:1240px;margin:auto;min-height:70px;padding:10px 24px;display:flex;align-items:center;gap:16px;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px}.brand-icon{border:1px solid #806e54;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--gold);font-size:24px}.brand b{font-size:17px;letter-spacing:.08em;white-space:nowrap}.brand small{display:block;color:var(--sub);font-size:11px;letter-spacing:.11em}.top-tools,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:.2rem .65rem;font-size:.84rem;white-space:nowrap}.gold{color:var(--gold)}.good{color:var(--teal)}.bad{color:var(--rose)}
.wrap{max-width:1240px;padding:25px 24px 40px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}.main,.side{min-width:0}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{padding:.42rem .8rem}.tabs [aria-current=page]{border-color:#a88b5d;background:#493d47;color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:14px}.side .panel{padding:15px}.eyebrow{font-size:.75rem;color:var(--gold);letter-spacing:.17em;font-weight:750}h1,h2,h3,p{margin:0 0 .48rem}h1,h2{line-height:1.25}h1{font-size:clamp(27px,4vw,42px);letter-spacing:.035em}h2{font-size:clamp(22px,3vw,28px)}h3{font-size:1rem}p:last-child{margin-bottom:0}.sub,small{color:var(--sub)}.small{font-size:.86rem}.divider{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.scene{position:relative;overflow:hidden;border-radius:16px;border:1px solid #4c506d;background:#262f50;aspect-ratio:2.15;margin-top:15px}.scene svg{width:100%;height:100%;display:block}.spot{position:absolute;transform:translate(-50%,-50%);background:#161d35ec;border:1px solid #a28e78;white-space:nowrap;font-size:clamp(12px,1.4vw,14px);padding:.34rem .57rem;box-shadow:0 3px 10px #0a0d20a0}.spot:active:not(:disabled){transform:translate(-50%,-49%)}.spot.active{border-color:var(--gold);color:var(--gold)}.spot.solved{border-color:var(--teal);color:var(--teal)}.scene-note{position:absolute;bottom:8px;right:10px;color:#e0dcf0;background:#131827cc;border-radius:5px;padding:0 5px;font-size:11px;pointer-events:none}.water-ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.8s infinite}.twinkle{animation:twinkle 3s infinite alternate}@keyframes ripple{from{opacity:.9;transform:scale(.85)}to{opacity:.18;transform:scale(1.16)}}@keyframes twinkle{to{opacity:.38}}
.dialog{margin-top:12px;background:var(--deep);border-left:3px solid #b99464;padding:13px;border-radius:0 12px 12px 0}.dialog p{color:var(--sub)}.dialog .row{margin-top:10px}.pocket{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.token{display:grid;place-items:center;min-height:50px;background:#12192a;border:1px dashed #4d5971;border-radius:9px;text-align:center;color:var(--sub);font-size:.8rem}.token.found{background:#2f3d4c;border:1px solid #948366;color:var(--gold)}.token i{font-style:normal;font-size:1.15rem;line-height:1}.hint{border-left:3px solid #9a8da9;background:#24263e;padding:.65rem .8rem;margin-top:.75rem;color:#e9daef;border-radius:0 10px 10px 0}.slots,.candidates,.cards,.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.slots button,.candidates button{text-align:left}.candidates{grid-template-columns:repeat(2,minmax(0,1fr))}.card,.metric{border:1px solid var(--line);background:var(--deep);border-radius:11px;padding:11px}.metric b{display:block;font-size:1.32rem;color:var(--gold)}.shelf{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin:10px 0}.cell{border:1px dashed var(--line);border-radius:7px;min-height:36px;display:grid;place-items:center;color:var(--sub);font-size:.9rem}.cell.filled{border-style:solid;background:#42374c;color:var(--gold)}.notice{border:1px solid #5e5368;background:#2c293e;padding:12px;border-radius:11px;margin:10px 0}.product{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.product:last-child{border-bottom:0}.product .row{justify-content:flex-end}.product button{padding:.3rem .56rem}.queue{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.queue span{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.85rem}.queue .now{border-color:var(--gold);color:var(--gold)}.queue .done{color:var(--sub);opacity:.67}.sale-log{padding-left:1.3rem;color:var(--sub);margin:.55rem 0;max-height:115px;overflow:auto}.live{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--deep);min-height:45px;color:var(--teal);margin-bottom:14px}.side .live{font-size:.9rem}.strike{position:relative;height:72px;background:#121a2a;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0}.strike::after{content:"";position:absolute;left:78%;width:3px;top:0;bottom:0;background:var(--gold)}.note{position:absolute;top:22px;transform:translateX(-50%);color:var(--teal);font-size:20px}.fine{font-size:.79rem;color:var(--sub)}summary{cursor:pointer;color:var(--gold)}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr) 210px;gap:12px;padding:18px 14px}.top-inner{padding:9px 14px}.cards{grid-template-columns:1fr 1fr}.shelf{grid-template-columns:repeat(5,1fr)}}
@media(max-width:680px){.wrap{display:flex;flex-direction:column}.side{display:grid;grid-template-columns:1fr 1fr;gap:9px}.side .live{grid-column:1/-1;grid-row:1}.top-inner{gap:7px}.top-tools{justify-content:flex-end}.brand{gap:7px}.brand-icon{width:32px;height:32px}.brand b{font-size:15px}.brand small{display:none}.top-tools button{padding:.25rem .5rem;font-size:.78rem}.top-tools .pill{font-size:.77rem}.panel{padding:13px}.scene{aspect-ratio:1.75}.product{grid-template-columns:1fr}.product .row{justify-content:flex-start}.metrics,.slots{gap:5px}.metric,.slots button{padding:7px}.spot{padding:.25rem .35rem}.tabs{gap:5px}.tabs button{font-size:.86rem;padding:.36rem .58rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.rhythm-art span{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
#scene-hand{left:51%;top:63%;font-size:24px;color:#ffdda0;text-shadow:0 0 9px #fff5b4}
#scene-lamp{left:61%;top:31%;font-size:25px;color:#fbe9ac;text-shadow:0 0 10px #ffc76e}
#scene-star{opacity:0;width:18px;height:18px;background:#fff5b2;clip-path:polygon(50% 0,62% 36%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 36%);filter:drop-shadow(0 0 8px #ffcb60)}
#scene-arc{opacity:0;left:61%;top:31%;width:78px;height:42px;border-bottom:3px solid #fbde91;border-right:3px solid #fbde91;border-radius:50%;box-shadow:0 5px 8px #ffe7a366}
#scene-lamp.flash,#scene-hand.flash{color:#fff;text-shadow:0 0 18px #fff6a0,0 0 36px #fff6a0;transform:translate(-50%,-50%) scale(1.55)}
.rhythm-help{padding-top:8px}
@media(max-width:680px){.rhythm-layout{grid-template-columns:1fr}.rhythm-art{width:min(100%,280px);margin:auto}}
.rhythm-art.echo #scene-lamp{color:#a1e2cc;text-shadow:0 0 22px #a1e2cc}.quest-glow{position:absolute;left:50%;top:33%;font-size:42px;color:#ffe6a0;text-shadow:0 0 24px #ffd480;pointer-events:none}
.opening-status{margin-top:12px;padding:10px 12px;border-left:3px solid #deaf7a;background:#211d31;border-radius:0 8px 8px 0}
.opening-status.ready{border-color:var(--teal)}.opening-status p{margin:3px 0 0;font-size:.91rem}
.ledger{margin:12px 0;padding:14px;border:1px solid #ab8b62;border-radius:12px;background:#2b2430}
.ledger-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.ledger-top h3{margin:0}
.ledger-scroll{overflow-x:auto;margin:10px 0}.ledger table{width:100%;border-collapse:collapse;text-align:left;font-size:.88rem;min-width:435px}
.ledger th,.ledger td{padding:8px;border-bottom:1px solid #675568}.ledger thead{color:var(--gold)}
.patron{border-color:#b58b5b;background:#342c40}
.clue-figure{height:36px;margin-top:6px;display:flex;align-items:center;gap:8px;padding:4px 9px;border-radius:6px}
.wood-slot{background:linear-gradient(#644331 16%,#392837 16% 84%,#644331 84%);border:1px solid #947150}
.clue-figure span{width:30px;height:16px;border:1px solid #c9a370;border-radius:2px;background:#ae9064}
.paper-fold{background:#463545}
.paper-fold span{height:20px;background:linear-gradient(135deg,#ceae81 49%,#927758 50% 53%,#ae8c62 54%);transform:rotate(-7deg)}
.paper-fold span:nth-child(2){transform:rotate(9deg)}
.moon-cast{color:#ffdf91;background:linear-gradient(90deg,#4b3c44,#25263a);font-size:21px}

.evidence-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.evidence-note{min-height:92px;padding:10px;background:#29253c;border:1px solid #615571;border-radius:10px}.evidence-note .row{margin-top:6px}
.seal-badge{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:.78rem}
.seal-badge i{display:grid;place-items:center;width:24px;height:24px;background:var(--wax);color:#fff2cd;border:1px solid #c8a982;border-radius:50%;font-size:16px;font-style:normal}
.parcel-row button{display:grid;justify-items:center;gap:6px;padding:8px 10px}
.parcel{display:block;width:35px;height:25px;position:relative;border-radius:4px;background:#b8986e;border:1px solid #debc8f;box-shadow:inset 0 0 0 2px #8f6b51}
.parcel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 45%,#694957 45% 55%,transparent 55%),linear-gradient(0deg,transparent 43%,#694957 43% 57%,transparent 57%)}
.paper-bunting{position:absolute;left:14%;top:39%;color:#ffdb9c;transform:rotate(-7deg);font-size:clamp(11px,2vw,20px);text-shadow:0 0 12px #ffc275;pointer-events:none}
@media(max-width:490px){.evidence-board{grid-template-columns:1fr}.ledger-scroll{margin-right:0}}
:root{--bg:#0d1422;--panel:#172235;--line:#35455c;--gold:#ebcd92;--text:#f5eddc;--muted:#bdcad9}
body{background:radial-gradient(ellipse at 14% 0%,#263548 0%,transparent 48%),radial-gradient(ellipse at 95% 28%,#20243b 0%,transparent 42%),#0e1422;color:#f5eddc}
[hidden]{display:none!important}
button:focus-visible,a:focus-visible{outline:3px solid #f8d388;outline-offset:3px}
.panel{border-radius:18px;background:linear-gradient(145deg,#1b293b,#171e31);box-shadow:0 12px 32px #070e1966}
.scene{border:1px solid #75624f;border-radius:14px}
.scene::after,.finale-scene::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 35px #121a30aa;border-radius:inherit}
.spot{z-index:1;border-color:#9d8968;background:#1b2437ee}
.title-screen{min-height:100svh;display:grid;place-items:center;padding:24px;position:relative;isolation:isolate;overflow:hidden}
.title-landscape{position:absolute;inset:0;z-index:-2;opacity:.72}
.title-landscape svg{width:100%;height:100%;object-fit:cover}
.title-screen::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#09101ceb 0%,#111b2bbf 48%,#11162530 100%),linear-gradient(0deg,#090d1a 0%,transparent 45%)}
.title-frame{width:min(1040px,100%);min-height:min(630px,calc(100svh - 48px));border:1px solid #b5966690;border-radius:24px;padding:clamp(24px,6vw,84px);display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:0 30px 90px #050a1470}
.title-frame::before{content:'✦';position:absolute;top:18px;right:22px;color:#ebcd92;font-size:24px}
.title-frame h1{font-family:Georgia,"Noto Serif CJK SC",serif;font-size:clamp(2.7rem,8vw,6.1rem);font-weight:700;line-height:1.08;margin:.35em 0 .12em;letter-spacing:.035em;color:#f8edd5;text-shadow:0 4px 24px #15192e}
.title-frame h2{font-size:clamp(1.1rem,4vw,1.8rem);font-weight:400;letter-spacing:.28em;color:#efd097}
.title-frame .sub{max-width:26em}.title-frame .row{margin-top:20px}.title-frame .fine{margin-top:24px}
.title-kicker{letter-spacing:.25em;color:#edce91;font-size:.76rem}
.title-frame button{min-height:45px}
button.primary{background:#efd197;color:#242033;border-color:#fbe6bf}
button.primary:hover:not(:disabled){background:#fff0c9}
body.reduced *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.game-dialog{color:#f4ead6;background:linear-gradient(140deg,#253348,#171f33);border:1px solid #a58c64;border-radius:18px;max-width:min(92vw,550px);width:100%;padding:0;max-height:85svh;box-shadow:0 18px 80px #050a16bb}
.game-dialog::backdrop{background:#070c18bb;backdrop-filter:blur(5px)}
.dialog-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#202b3e;border-bottom:1px solid #76634b;z-index:2}
.dialog-head h2{margin:0;font-size:1.32rem}.dialog-head button{padding:6px 11px}
.dialog-body{padding:16px 20px 22px}.option-row,.receipt-sheet>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #41475a}
.bag-grid,.mode-grid,.parcel-board{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}

}

   ?(group?[{k:'paper',n:2},{k:'candy',n:3},{k:'paper',n:1}]:[{k:'paper',n:2},{k:'candy',n:2},{k:'paper',n:1},{k:'candy',n:1}])

function recommend(){

 const reserveOpening=Number.isFinite(cheapest)&&budget>=Math.max(0,10-sum(qty))*cheapest;
 function add(k,target){
  if(!s.unlock.includes(k))return;
  const cost=items[k].cost;
  let x=Math.max(0,Math.min(target-qty[k],room,Math.floor(budget/cost)));
  while(reserveOpening&&x>0&&budget-x*cost<Math.max(0,10-sum(qty)-x)*cheapest)x--;
  plan[k]+=x;qty[k]+=x;room-=x;budget-=x*cost;
 }
 for(const k of keys)if(n[k])add(k,n[k]);
 if(option)add(option.key,n[option.key]+option.quantity);
 let defaultKey=s.unlock.includes('candy')?'candy':s.unlock[0];
 if(defaultKey)add(defaultKey,qty[defaultKey]+Math.max(0,10-sum(qty)));

}

function modeName(mode){

function openingRequirements(queue=tonightQueue(),option=windowOption()){
 const shelfShort=Math.max(0,10-sum(s.shelf));
 const required=option?needs(queue)[option.key]+option.quantity:0;
 const basic=needs(dayQueue());
 const baseShort=option?.fee?keys.reduce((n,k)=>n+Math.max(0,basic[k]-s.shelf[k]),0):0;
 return {shelfShort,required,baseShort,productShort:option?Math.max(0,required-s.shelf[option.key]):0,feeShort:option?.fee?Math.max(0,option.fee+6-s.money):0};
}
function displayReady(){
 const r=openingRequirements();
 return !(r.baseShort||r.productShort||r.feeShort);
}

 '<div class="mode-grid">'+choices.map(k=>b('<b>'+modeName(k)+'</b><small>'+(descriptions[k]||('多备 3 件 · 来客率 '+m.p*100+'%<br>成单 +6 币，未成单 −2 币'))+'</small>','display',{k,cls:'mode-card '+(mode===k?'chosen':'')})).join('')+'</div>'+
 status+'<p class="fine">橱窗开门时收 2 币。常规订单须备齐，付费后至少留 6 币周转。</p>';

function windowOrder(option){
 const total=items[option.key].price*option.quantity+option.bonus;
 return {k:option.key,n:option.quantity,tender:total+2,optional:true,bonus:option.bonus};
}
function addWindowOrder(queue){
 const option=windowOption();
 if(!option||s.rescue)return {queue,fee:0,displayStatus:''};
 const visited=option.chance===1||dayRoll(s.day,9517)<option.chance;
 if(visited)queue.push(windowOrder(option));
 return {queue,fee:option.fee,displayStatus:visited?'额外顾客来了。':'今晚没有主题客人，商品保留。'};
}
const amountDue=o=>items[o.k].price*o.n+(o.bonus||0);

function simulateTill(queue,fee){
 const rack={...s.shelf}, stock={...s.stock};
 let sales=0,cost=0,miss=0;
 for(const order of queue){
  if(!sum(rack)){miss+=queue.slice(queue.indexOf(order)).filter(o=>!o.optional).length;break;}
  const gap=Math.max(0,order.n-rack[order.k]);
  if(gap&&stock[order.k]>=gap&&s.shelfCap-sum(rack)>=gap){
   stock[order.k]-=gap;
   rack[order.k]+=gap;
  }
  if(rack[order.k]>=order.n){
   rack[order.k]-=order.n;
   sales+=amountDue(order);
   cost+=order.n*items[order.k].cost;
  }else if(!order.optional)miss++;
 }
 return {sales,margin:sales-cost-fee,cash:s.money-fee+sales,miss};
}
function ledgerPanel(){
 if(!s.ledger)return '';
 const top='<div class="ledger-top"><div><div class="eyebrow">背包道具</div><h3>黄铜扣账簿</h3></div>'+b(s.ledgerOpen?'合上账簿':'翻开账簿','ledger',{cls:'primary'})+'</div>';
 if(!s.ledgerOpen)return '<div class="ledger">'+top+'<p>开门前看货量、营业额、利润和最差情形。可随时重算。</p></div>';
 const queue=tonightQueue(), modes=['none','local',...s.unlock.filter(k=>k!=='candy')];
 const rows=modes.map(mode=>{
  const option=windowOption(mode), req=openingRequirements(queue,option);
  const name=modeName(mode);
  const blocked=req.shelfShort||req.productShort||req.feeShort||req.baseShort;
  const labelMissing=(req.shelfShort?'货架总量差 '+req.shelfShort+' 件。':'')+(req.productShort?label(option.key)+'差 '+req.productShort+' 件。':'')+(req.feeShort?'含周转金还差 '+req.feeShort+' 币。':'')+(req.baseShort?'常规订单缺 '+req.baseShort+' 件。':'');
  if(blocked){
   const delta=option?((items[option.key].price-items[option.key].cost)*option.quantity+option.bonus)*option.chance-option.fee:0;
   const worst=option&&option.chance<1?'，最差少 '+option.fee+' 币':'';
   return '<tr><th>'+name+'</th><td colspan="3">暂不能开门 · '+labelMissing+'<br><small>备齐后预计比普通营业多 '+delta+' 币'+worst+'。</small></td></tr>';
  }
  const fee=option?.fee||0, fallback=simulateTill(queue,fee);
  const extra=option?simulateTill(queue.concat(windowOrder(option)),fee):fallback;
  const chance=option?.chance??0;
  const projected=fallback.margin+(extra.margin-fallback.margin)*chance;
  const branch=(v1,v2)=>chance===1?v2+' 币':v1===v2?v1+' 币':v1+' 至 '+v2+' 币';
  return '<tr><th>'+name+'</th><td>'+branch(fallback.sales,extra.sales)+(fallback.miss?'<br><small>可能缺 '+fallback.miss+' 单</small>':'')+'</td><td>'+projected+' 币<br><small>'+branch(fallback.margin,extra.margin)+'</small></td><td>'+branch(fallback.cash,extra.cash)+'</td></tr>';
 }).join('');
 return '<div class="ledger">'+top+'<div class="ledger-scroll"><table><thead><tr><th>门面</th><th>营业额</th><th>期望利润 / 波动</th><th>打烊现金</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
 '<p class="fine">按当前货架、仓库和可补货量预估，未扣未来采购。利润已扣售出商品成本和陈列费。打烊现金从当前余额算起。主题未到访只损失陈列费，货还在。来信客人的可选交易另计。</p></div>';
}

function playTone(note,when,gain=.09,duration=.28){
 const oscillator=audio.createOscillator(), volume=audio.createGain();
 oscillator.type='triangle';
 oscillator.frequency.value=440*2**((note-69)/12);
 volume.gain.setValueAtTime(.001,when);
 volume.gain.exponentialRampToValueAtTime(gain,when+.025);
 volume.gain.exponentialRampToValueAtTime(.001,when+duration);
 oscillator.connect(volume);
 volume.connect(run.output);
 oscillator.start(when);
 oscillator.stop(when+duration+.01);
 run.voices.push(oscillator);
}
function startRhythm(){

 if(!s.muted){
  try{
   audio??=new (window.AudioContext||window.webkitAudioContext)();
   audio.resume().catch(()=>{});
   run.output=audio.createGain();
   run.output.connect(audio.destination);
   const audioStart=audio.currentTime+.10;
   theme.forEach((note,i)=>{if(note!==null)playTone(note,audioStart+i*beatLength,.065,.42)});
   starEvents.forEach(e=>playTone(e.kind==='catch'?86:55,audioStart+e.at-.30,.08,.17));

function rhythmTime(now=performance.now()){return (now-run.start)/1000}
function step(now){

 for(const event of run.events){
  if(event.state)continue;
  if((event.demo||rMode==='guided')&&t>=event.at){
   event.state='demo';
   run.flash={kind:event.kind,until:t+.24};
   run.note=(rMode==='guided'?'莉丝 · ':'示范 · ')+(event.kind==='catch'?'接住星光':'摇灯应拍');
  }else if(t>event.at+.18){
   event.state='miss';
   run.note='错过一拍，跟上下一次提示。';
  }
 }
 const current=run.events.find(e=>!e.state&&e.at-t<=.52);
 const star=$('#scene-star'), arc=$('#scene-arc');
 if(!star||!arc){stopRhythm();return}
 star.style.opacity=current?.kind==='catch'?'1':'0';
 arc.style.opacity=current?.kind==='lamp'?'1':'0';
 if(current?.kind==='catch'){
  const approach=Math.max(0,Math.min(1,1-(current.at-t)/.52));
  star.style.left=(67-16*approach)+'%';
  star.style.top=(38+25*approach)+'%';
 }
 if(current?.kind==='lamp'){
  const angle=Math.max(-30,Math.min(30,(current.at-t)*57));
  arc.style.transform='translate(-50%,-50%) rotate('+angle+'deg)';
 }
 $('#rhythm-art').classList.toggle('echo',run.echo===true);
 $('#scene-hand').classList.toggle('flash',run.flash?.kind==='catch'&&run.flash.until>t);
 $('#scene-lamp').classList.toggle('flash',run.flash?.kind==='lamp'&&run.flash.until>t);
 const fraction=Math.min(1,Math.max(0,t/(theme.length*beatLength)));
 $('#phrase-fill').style.transform='scaleX('+fraction+')';
 const info=$('#beat-info'), update=run.note+(rMode==='guided'?'':' ｜ '+run.hits+' / '+scoredEvents);
 if(info.textContent!==update)info.textContent=update;
 if(t>theme.length*beatLength+.05){
  const hits=run.hits;

 }

  bag:['收藏家的背包','<div class="bag-grid">'+Object.entries(memories).map(([k,m])=>'<div class="bag-item '+(s.spots[k]?'found':'')+'"><i>'+m.i+'</i><b>'+m.n+'</b><small>'+(s.spots[k]?'已记录 · 旋律片段':'待发现')+'</small></div>').join('')+'</div><div class="divider"><h3>随身道具</h3>'+(s.ledger?'<div class="option-row"><span>▤ 黄铜扣账簿</span>'+b('去小店查看预测','useLedger',{disabled:!shopReady()})+'</div>':'<p class="sub">完成月牙甜点委托后，埃米尔会把账簿交给你。</p>')+'<p>工坊余料 · '+(s.scraps||0)+' 片</p></div>'],
  rest:['今晚休息？','<p>今晚会跳过柜台营业。现金、库存和已完成的委托会保留。</p><div class="row">'+b('继续备货','closeModal')+b('确认休息','rest',{cls:'primary'})+'</div>'],
  opening:['确认营业','<p>门面：'+modeName(s.display||'none')+'。'+((windowOption()?.fee)?'开门时支付 '+windowOption().fee+' 币。主题客到访率 '+Math.round(windowOption().chance*100)+'%。':'今晚不收陈列费。')+'</p><p class="sub">预约客人会先来。门面带来的额外订单排在之后。</p>'+(s.accepted?'<p class="bad">尚未交付的委托会留到下一天，今天的测试到此结束。</p>':'')+'<div class="row">'+b('继续备货','closeModal')+b('点亮店灯','startNight',{cls:'primary'})+'</div>'],
  night:['打烊小票',s.night?'<div class="receipt-sheet"><div><span>营业额</span><b>'+s.night.revenue+' 币</b></div><div><span>扣成本与陈列费</span><b>'+s.night.expense+' ＋ '+(s.night.displayFee||0)+' 币</b></div><div><span>本夜利润</span><b>'+(s.night.revenue-s.night.expense-(s.night.displayFee||0))+' 币</b></div></div><p class="sub">'+(s.night.visitor&&!s.night.visitor.done?'门边还有一位来信客人。':'钱和余货都已记入存档。')+'</p>'+b(s.night.visitor&&!s.night.visitor.done?'去接待来访客人':'查看结算','closeModal',{cls:'primary'}):''],
  reward:[s.lastReward?.title||'委托完成','<div class="reward-sigil" aria-hidden="true">✦</div><p>'+ (s.lastReward?.line||'已记录在收藏手记。')+'</p>'+b('收下并继续','closeModal',{cls:'primary'})]
 };
 const letterKey=modal.startsWith('letter-')?modal.slice(7):null;
 const letter=letterKey&&quests[letterKey];
 const content=letter?[letter.title,'<div class="letter-paper"><p>'+letter.letter.join('</p><p>')+'</p></div><div class="row">'+b('稍后再读','closeModal')+b('接下委托','accept',{k:letterKey,cls:'primary',disabled:!remaining()||s.stage!=='day'})+'</div>']:data[modal];
 if(!content)return;
 $('#dialog-heading').textContent=content[0];
 const focused=dialog.contains(document.activeElement)?document.activeElement.dataset:undefined;
 $('#dialog-body').innerHTML=content[1];
 if(!dialog.open)dialog.showModal();
 else if(focused?.a){
  const same=[...dialog.querySelectorAll('button[data-a]')].find(el=>el.dataset.a===focused.a&&el.dataset.k===focused.k);
  (same||dialog.querySelector('button')).focus({preventScroll:true});
 }
}
function enterGame(reset=false){
 if(reset){
  const prefs={muted:s.muted,reduced:s.reduced};
  s={...fresh(),...prefs};
  open=null;hint=0;selected=null;wrongSlot=-1;invalidPay=false;result='';stopRhythm();
  say('莉丝哼着半段童谣。去窗下听一听。');
 }
 s.started=true;
 screen='game';
 closeModal();
 window.scrollTo(0,0);
}
function finaleView(){
 return panels('<div class="finale-scene">'+dreamArt()+'</div>'+header('探索尾声 · 莉丝','把这支歌唱完','你把散掉的几拍带回来了。灯往回摆时，我给你第一拍。')+
 '<div class="row">'+b('和莉丝合奏','finaleStart',{k:'manual',cls:'primary'})+b('请莉丝带拍','finaleStart',{k:'guided'})+'</div><p class="fine">两种方式都能结算本次探索。亲手合奏会留下演出评价。</p>');
}
function completeFinale(hits, guided){
 if(!s.chapter&&s.finale==='ready'){
  s.chapter=true;s.finale='done';s.explores=1;s.unlock.push('candy');s.money+=2;
  s.performance=guided?'莉丝带拍':hits+' / '+scoredEvents+' 拍';
  s.tab='coda';
  say('这回我记住了。等妈妈收完最后一个箱子，我唱给她听。');
 }else s.tab='archive';
}
function codaView(){
 return panels(header('探索结算 · 莉丝','这首曲子有了结尾','妈妈收好最后一个箱子。莉丝牵住她的手，把完整的曲子又哼了一遍。')+
 '<div class="finale-scene">'+dreamArt()+'</div><div class="receipt-sheet"><div><span>图鉴发现</span><b>星星糖</b></div><div><span>探索奖励</span><b>＋2 币</b></div><div><span>演出落款</span><b>'+s.performance+'</b></div></div>'+
 '<div class="row">'+b('带着发现回小店','tab',{k:'shop',cls:'primary'})+b('打开背包','modal',{k:'bag'})+'</div>');
}

function perform(a,k){

 switch(a){
 case 'newGame':if(s.started)showModal('reset');else enterGame(true);break;
 case 'continue':enterGame();break;
 case 'modal':showModal(k);break;
 case 'closeModal':closeModal();break;
 case 'motion':s.reduced=!s.reduced;break;
 case 'toTitle':stopRhythm();if(s.tab==='rhythm')s.tab=s.chapter?'archive':'finale';screen='title';closeModal();window.scrollTo(0,0);break;
 case 'resetYes':enterGame(true);break;
 case 'finaleStart':
  if((s.finale==='ready'&&!s.chapter)||s.chapter){
   rMode=k==='guided'?'guided':'manual';s.tab='rhythm';startRhythm();window.scrollTo(0,0);
  }
  break;
 case 'paperPick':if(s.accepted==='paper'&&seals[k]){s.paperPick=k;s.investigationError='';}break;
 case 'paperTest':{
  if(s.accepted!=='paper'||(k==='shape'?open!=='window':k!=='material'||open!=='receipt'))break;
  const pick=s.paperPick||'leaf';
  s.paperTests[pick]??={};
  s.paperTests[pick][k]=missions.paper.facts[k][1].includes(pick);
  s.investigationError='';
  break;
 }
 case 'paperGirl':if(s.accepted==='paper'&&open==='girl'){
  for(const pick of Object.keys(seals)){
   s.paperTests[pick]??={};
   s.paperTests[pick].shape=missions.paper.facts.shape[1].includes(pick);
  }
  say('莉丝的记录已抄到纸样对照板。');
 }break;
 case 'coin':if(s.stage==='open'&&[1,2,5].includes(+k)){
  const n=s.night;
  if(n.coins[k]>(n.changeDraft[k]||0)){n.changeDraft[k]=(n.changeDraft[k]||0)+1;n.coinTrail.push(+k);}
 }break;
 case 'undoCoin':if(s.stage==='open'){
  const coin=s.night.coinTrail.pop();
  if(coin)s.night.changeDraft[coin]--;
 }break;
 case 'payCoins':if(s.stage==='open'){
  const n=s.night,o=n.queue[n.index],selected=Object.entries(n.changeDraft).reduce((v,[k,c])=>v+Number(k)*c,0);
  if(s.shelf[o.k]>=o.n&&selected===o.tender-amountDue(o)){
   for(const [k,c] of Object.entries(n.changeDraft))n.coins[k]-=c;
   order(true);
  }
 }break;
 case 'fastPay':if(s.stage==='open'){
  const o=s.night.queue[s.night.index];
  if(s.shelf[o.k]>=o.n)order(true);
 }break;
 case 'mute':s.muted=!s.muted;if(run?.output)run.output.gain.value=s.muted?0:1;if(!s.muted&&!run)sound();break;
 case 'reset':showModal('reset');break;
 case 'tab':
  if(!s.chapter&&k==='dream'&&s.finale==='ready'){stopRhythm();s.tab='finale';window.scrollTo(0,0);break;}
  if(!s.chapter&&k!=='dream')break;
  if(s.stage==='open'&&k!=='shop'){say('先接待完柜台的顾客。');break;}
  stopRhythm();s.tab=k;open=null;window.scrollTo(0,0);break;
 case 'open':open=k;hint=0;if(k==='girl'&&!s.spots.sugar)sound([60,60,67]);break;
 case 'sugar':if(open==='girl')mark('sugar');break;
 case 'water':if(open==='pond'&&!s.water){s.water=true;sound([64,67]);say('绳梢离开水面，倒影稳定下来。')}break;
 case 'pond-try':say('水纹更密了。看看波纹从哪里开始。');break;
 case 'pond':if(open==='pond'&&s.water)mark('pond');break;
 case 'cat-bed':if(open==='cat'&&!s.cat){s.cat=true;sound([65,62]);say('小猫坐进软垫，露出背上的星纹。')}break;
 case 'cat-try':say('小猫躲到妈妈身边了。也许可以先让它觉得舒服。');break;
 case 'cat':if(open==='cat'&&s.cat)mark('cat');break;
 case 'hint':hint=Math.min(3,hint+1);s.stats.hints++;break;
 case 'fragment':if(allFound()&&memories[k]){selected=k;wrongSlot=-1;sound(memories[k].tones);say('选中「'+memories[k].n+'」。选择一个位置放入。')}break;
 case 'slot':{
  let i=Number(k);if(!selected){say('先选择要放入的旋律片段。');break;}
  if(slotDefs[i]?.[2]===selected){s.slots[i]=selected;s.lastSlot=i;wrongSlot=-1;selected=null;sound([72,76]);say('这一段接上了。')}else{wrongSlot=i;sound([53]);say('这个位置的边缘没接上；放对的片段仍在。')}break;
 }
 case 'undo':if(s.slots.some(Boolean)){let i=s.slots[s.lastSlot]?s.lastSlot:s.slots.findLastIndex(Boolean);s.slots[i]=null;wrongSlot=-1;say('已撤回一段旋律。')}break;
 case 'finish':if(allFound()&&s.slots.every(Boolean)&&!s.chapter){
  s.finale='ready';s.tab='finale';say('莉丝在窗边点亮了灯。');window.scrollTo(0,0);
 }break;
 case 'accept':if(s.chapter&&s.stage==='day'&&remaining()&&!week()&&availableQuests().includes(k)&&!s.accepted){closeModal();s.explores++;s.accepted=k;s.paperTests={};s.paperPick='leaf';s.evidence=[];s.investigationError='';hint=0;open=null;say('回到旧街角。带着这封信查看货摊。')}break;
 case 'investigationHint':if(s.accepted)hint=Math.min(2,hint+1);break;
 case 'investigate':{
  const clue=missions[s.accepted]?.scene[k];
  if(!clue?.[1]||open!==k)break;
  s.evidence??=[];
  if(!s.evidence.includes(clue[2]))s.evidence.push(clue[2]);
  s.investigationError='';
  say('手记已记下新的现场证据。');
  break;
 }
 case 'deliverTag':{
  const q=activeQuest();
  if(!q||!seals[k])break;
  const paper=s.accepted==='paper';
  if(paper?(s.paperTests[k]?.shape===undefined||s.paperTests[k]?.material===undefined):(!s.evidence?.includes('shape')||!s.evidence.includes('material')))break;
  if(k!==missions[s.accepted].answer){
   const facts=missions[s.accepted].facts;
   const unmatched=Object.values(facts).find(([,marks])=>!marks.includes(k));
   s.investigationError=seals[k].name+'还不符合「'+unmatched[0]+'」这一条。可以保留记录再试。';
   say(s.investigationError);
   break;
  }
  if(!s.done.includes(s.accepted)){
   s.done.push(s.accepted);
   if(!s.unlock.includes(q.answer))s.unlock.push(q.answer);
   s.money+=q.reward;
   if(q.answer==='moon'){s.capacity+=4;s.ledger=true;}
   say('委托完成：可采购'+label(q.answer)+'，获得 '+q.reward+' 币。'+(q.answer==='moon'?' 仓库增加 4 格。获得黄铜扣账簿，今晚备货时就能翻开。':''));
  }
  s.lastReward={title:q.title,line:q.answer==='paper'?'莉丝把纸星星挂上窄窗。灯一亮，玻璃上多了一颗星。已解锁纸星星采购，获得 3 币。':'埃米尔收好糖纸，把黄铜扣账簿递给你。已解锁月亮糖采购，仓库增加 4 格，获得 3 币。'};
  s.accepted=null;s.investigationError='';hint=0;open=null;
  sound(q.answer==='paper'?[72,72,79,79,81,81,79,76,74,72]:[69,72,76],.43);
  showModal('reward');break;
 }
 case 'abandon':s.accepted=null;s.pick=null;s.proof=[];say('暂放来信。已用的探索次数不会退回，没有信誉惩罚。');break;
 case 'buy':if(buy(k,1))say('采购了 1 件'+label(k)+'。');break;
 case 'buyPlan':{let q=recommend(),n=keys.reduce((t,k)=>t+buy(k,q.plan[k]),0);if(n)say('按需求采购 '+n+' 件，先入仓。');break;}
 case 'shelf':if(shopReady()&&move(k,1,true))say(label(k)+'已上架。');break;
 case 'unshelf':if(shopReady()&&move(k,1,false))say(label(k)+'已撤回仓库。');break;
 case 'stockAll':if(shopReady()){let n=needs(tonightQueue());const option=windowOption();if(option)n[option.key]+=option.quantity;for(let k of keys)move(k,Math.max(0,n[k]-s.shelf[k]),true);for(let k of keys)move(k,s.stock[k],true);say('优先按今晚需求上架，剩余货位再放其他商品。');}break;
 case 'unshelfAll':if(shopReady()){for(let k of keys)move(k,s.shelf[k],false);say('能入仓的商品已撤下。');}break;
 case 'craft':if(shopReady()&&s.stage==='day'&&remaining()&&!s.crafted&&sum(s.stock)+2<=s.capacity){s.explores++;s.stock.craft+=2;s.crafted=true;say('手作纸星 2 件已入仓。今晚有邻居来收。');}break;
 case 'rescue':if(shopReady()&&!s.rescue&&rescueGap()>0){
  let n=Math.max(0,10-counts());s.stock.craft+=n;s.rescue=true;s.display='none';s.explores=2;s.accepted=null;prepare();say('赶工完成：'+n+' 件手作纸星入仓。今天的邻居会先来收货。');
 }break;
 case 'useLedger':if(s.ledger&&shopReady()){s.tab='shop';s.ledgerOpen=true;closeModal();window.scrollTo(0,0);}break;
 case 'ledger':if(s.ledger&&shopReady())s.ledgerOpen=!s.ledgerOpen;break;

 case 'guest':{
  const visitor=s.night?.visitor;
  if(s.stage!=='settled'||!visitor||visitor.done)break;
  if(k==='sale'){
   if(s.shelf.candy<1)break;
   s.shelf.candy--;
   s.money+=items.candy.price;
   s.night.revenue+=items.candy.price;
   s.night.expense+=items.candy.cost;
   s.night.units++;
   s.night.logs.push(visitor.name+'买了一颗星星糖，并留下来信。');
  }
  visitor.done=true;
  say('已收下「'+visitor.letter+'」。明天可以回访。');
  break;
 }
 case 'recycle':
  if(shopReady()&&!s.rescue&&!s.recycled&&(s.scraps||0)>=2&&sum(s.stock)<s.capacity){
   s.scraps-=2;
   s.stock.craft++;
   s.recycled=true;
   say('两片纸边拼成了一颗手作纸星，已入仓。');
  }
  break;
 case 'display':if(shopReady()&&!s.rescue&&s.day>=2&&(['none','local'].includes(k)||(k!=='candy'&&s.unlock.includes(k))))s.display=k;break;
 case 'startNight':if(shopReady()&&sum(s.shelf)>=10&&displayReady()){
  const opening=addWindowOrder(queueWithCraft());
  closeModal();
  s.money-=opening.fee;
  s.accepted=null;
  s.stage='open';
  s.night=createNight(opening.queue);
  s.night.displayFee=opening.fee;
  s.night.displayStatus=opening.displayStatus;
  s.night.mode=s.display;
  window.scrollTo(0,0);
  s.tab='shop';
  say('开门了。看看第一位顾客想买什么。');
 }break;
 case 'replenish':if(s.stage==='open'){let o=s.night.queue[s.night.index],n=o.n-s.shelf[o.k];if(n>0&&s.stock[o.k]>=n&&s.shelfCap-sum(s.shelf)>=n){move(o.k,n,true);say('已经为这位顾客补齐商品。')}}break;

 case 'miss':if(s.stage==='open'){let o=s.night.queue[s.night.index];if(s.shelf[o.k]<o.n)order(false)}break;
 case 'assist':if(s.stage==='open'&&s.night.served>0)while(s.stage==='open'){let o=s.night.queue[s.night.index],gap=o.n-s.shelf[o.k];if(gap>0&&s.stock[o.k]>=gap&&s.shelfCap-sum(s.shelf)>=gap)move(o.k,gap,true);order(s.shelf[o.k]>=o.n)}break;
 case 'rest':if(shopReady()){closeModal();s.accepted=null;s.night=createNight([]);s.night.rest=true;finishNight('rest')}break;
 case 'advance':if(s.stage==='settled'||(week()&&s.chapter)){stopRhythm();s.day++;s.stage='day';s.tab='dream';s.explores=0;s.night=null;s.ledgerOpen=false;s.passArmed=false;s.recycled=false;s.rescue=false;s.display='none';s.crafted=false;s.week={played:false,fc:false};s.accepted=null;s.proof=[];s.pick=null;invalidPay=false;say(week()?'今天是休息日。莉丝在信里说，她还记得那支曲子。':'新的一天。读一读来信，或者先去小店。')}break;
 case 'upgrade':if(shopReady()&&s.day>=3&&!s.upgraded&&s.money>=25){s.money-=25;s.shelfCap+=2;s.upgraded=true;say('货架增加 2 格。')}break;
 case 'hire':if(shopReady()&&s.day>=3&&!s.staff&&s.money>=65){s.money-=65;s.staff=true;say('店员到岗，每个营业日多一位甜点顾客。')}break;

 case 'tap':tap(k);return;
 case 'rhythmPause':if(run){stopRhythm();result='已暂停。可从头重来，或返回上一页。';}break;
 case 'rhythmExit':stopRhythm();s.tab=s.chapter?'archive':'finale';window.scrollTo(0,0);break;
 }
 render();
}
document.addEventListener('click',ev=>{
 let el=ev.target.closest('button[data-a]');if(!el||el.disabled)return;
 let a=el.dataset.a,k=el.dataset.k;
 const hotspot=el.classList.contains('spot');
 perform(a,k);
 if(hotspot){
  const detail=$('#view .bench, #view .dialog');
  if(detail&&detail.getBoundingClientRect().bottom>innerHeight){
   detail.scrollIntoView({block:'start',behavior:'instant'});
  }
 }
 if(a==='tap'||$('#game-dialog').open)return;
 let found=Array.from(document.querySelectorAll('button[data-a]')).find(b=>b.dataset.a===a&&b.dataset.k===k&&!b.disabled&&b.getClientRects().length);
 found?.focus({preventScroll:true});
});
document.addEventListener('keydown',e=>{if(e.code==='Escape'&&screen==='game'&&!$('#game-dialog').open){
 if(run){e.preventDefault();perform('rhythmPause');return;}
 if(s.tab!=='rhythm'){e.preventDefault();showModal('settings');return;}
 }if(['Space','Enter'].includes(e.code)&&s.tab==='rhythm'&&run&&!$('#game-dialog').open){e.preventDefault();if(!e.repeat)tap(e.code==='Space'?'catch':'lamp')}});
window.addEventListener('blur',()=>{if(run){stopRhythm();result='已暂停。可以重新开始这一段。';render()}});
$('#game-dialog').addEventListener('close',()=>{
 if($('#game-dialog').open)return;
 modal=null;
 if(!focusBack)return;
 const {trigger,action,key}=focusBack;
 focusBack=null;
 const visible=el=>!el.disabled&&el.getClientRects().length>0;
 const candidate=trigger?.isConnected&&visible(trigger)?trigger:
  [...document.querySelectorAll('button[data-a]')].find(el=>el.dataset.a===action&&el.dataset.k===key&&visible(el));
 (candidate||document.querySelector('#tabs [aria-current="page"]'))?.focus({preventScroll:true});
});

if(s.tab==='rhythm')s.tab=s.chapter?'archive':'finale';
render();
</script>
