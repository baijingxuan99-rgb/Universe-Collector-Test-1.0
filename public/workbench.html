<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宇宙收藏家 · 原型工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10121e;color:#f2ede3;font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:4vw 20px}header{border-bottom:1px solid #414252;padding-bottom:24px}h1{font-size:clamp(32px,6vw,56px);line-height:1.1;margin:.3em 0}a{color:#ffd693}nav,.filters,.links{display:flex;gap:14px;flex-wrap:wrap}.filters{margin:24px 0}input,select,textarea{font:inherit;color:inherit;background:#202436;border:1px solid #61657d;border-radius:8px;padding:9px}input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}.card{background:#1b1e2f;border:1px solid #35394f;border-radius:12px;padding:16px}.card h2{font-size:18px;margin:3px 0 10px;overflow-wrap:anywhere}small,#count{color:#bbbfd2}textarea{display:block;width:100%;min-height:100px;margin-top:8px}button{font:inherit;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;background:#ffd693;color:#151421}section{margin-top:24px}
</style></head><body><main><header><h1>宇宙收藏家</h1><p>版本归档与循环试玩</p><nav><a href="https://cosmic-collector-workbench.popular-tremors-2r46.chatgpt.site/">策划与数值工作台</a><a href="https://github.com/baijingxuan99-rgb/Universe-Collector-Test-1.0">GitHub 源码</a></nav></header>
<div class="filters"><input id="query" type="search" aria-label="搜索版本" placeholder="搜索版本或实验"><select id="kind" aria-label="筛选类别"><option>全部</option><option>历代原型</option><option>循环实验</option><option>设计资料</option></select></div>
<p id="count" role="status"></p><div id="cards" class="grid"></div>
<section><label for="notes">试玩笔记（当前浏览器）</label><textarea id="notes" placeholder="版本、遇到的问题、下一次想验证什么"></textarea><p><button id="download">导出笔记</button> <small id="note-status" role="status"></small></p></section>
</main><script>
const rows=[{"name": "把琴声挪一拍", "kind": "循环实验", "play": "sound-shop.html", "alt": "sound-shop.html?mode=preset"}, {"name": "今晚来过的人", "kind": "循环实验", "play": "loop-lab/index.html", "data": "project/loop-iteration-v1.csv"}, {"name": "玩法大迭代 V1", "kind": "设计资料", "play": "project/loop-iteration-v1.html", "data": "project/loop-iteration-v1.csv"}, {"name": "V17", "kind": "历代原型", "play": "releases/v17/Cosmic_Collector_V17_PC_Offline.html", "zip": "releases/v17/Cosmic_Collector_V17_Windows_Offline.zip"}, {"name": "V16", "kind": "历代原型", "play": "releases/v16/Cosmic_Collector_V16_PC_Offline.html", "zip": "releases/v16/Cosmic_Collector_V16_Windows_Offline.zip"}, {"name": "V15", "kind": "历代原型", "play": "releases/v15/Cosmic_Collector_V15_PC_Offline.html", "zip": "releases/v15/Cosmic_Collector_V15_Windows_Offline.zip"}, {"name": "V14", "kind": "历代原型", "play": "releases/v14/Cosmic_Collector_V14_PC_Offline.html", "zip": "releases/v14/Cosmic_Collector_V14_Windows_Offline.zip"}, {"name": "V13", "kind": "历代原型", "play": "releases/v13/Cosmic_Collector_V13_PC_Offline.html", "zip": "releases/v13/Cosmic_Collector_V13_Windows_Offline.zip"}, {"name": "V12", "kind": "历代原型", "play": "releases/v12/Cosmic_Collector_V12_PC_Offline.html", "zip": "releases/v12/Cosmic_Collector_V12_Windows_Offline.zip"}, {"name": "V11", "kind": "历代原型", "play": "releases/v11/Cosmic_Collector_V11_PC_Offline.html", "zip": "releases/v11/Cosmic_Collector_V11_Windows_Offline.zip"}, {"name": "V10", "kind": "历代原型", "play": "releases/v10/Cosmic_Collector_V10_PC_Offline.html", "zip": "releases/v10/Cosmic_Collector_V10_Windows_Offline.zip"}, {"name": "V9", "kind": "历代原型", "play": "releases/v9/Cosmic_Collector_V9_PC_Offline.html", "zip": "releases/v9/Cosmic_Collector_V9_Windows_Offline.zip"}, {"name": "V8", "kind": "历代原型", "play": "releases/v8/Cosmic_Collector_V8_Paris_Offline.html", "zip": "project/Cosmic_Collector_V8_Windows_Offline.zip"}, {"name": "V7", "kind": "历代原型", "play": "project/Cosmic_Collector_V7_Gallery_Offline.html"}, {"name": "V6", "kind": "历代原型", "play": "project/Cosmic_Collector_V6_Offline.html"}, {"name": "V5", "kind": "历代原型", "play": "project/Cosmic_Collector_V5_Offline.html"}, {"name": "V4", "kind": "历代原型", "play": "project/Cosmic_Collector_V4_Offline.html"}, {"name": "V2", "kind": "历代原型", "play": "project/cosmic-collector-v2-offline.html"}, {"name": "莫扎特梦境 · 早期原型", "kind": "历代原型", "play": "project/Cosmic_Collector_Mozart_Dream_Offline.html"}, {"name": "商店与探索 UI 草稿", "kind": "设计资料", "play": "project/Cosmic_Collector_UI_Review_Draft.html"}, {"name": "chapters", "kind": "设计资料", "play": "project/chapters.html", "data": "project/chapters.md"}, {"name": "early-design", "kind": "设计资料", "play": "project/early-design.html", "data": "project/early-design.md"}, {"name": "economy", "kind": "设计资料", "play": "project/economy.html", "data": "project/economy.md"}, {"name": "loop-review", "kind": "设计资料", "play": "project/loop-review.html", "data": "project/loop-review.md"}, {"name": "production", "kind": "设计资料", "play": "project/production.html", "data": "project/production.md"}, {"name": "story", "kind": "设计资料", "play": "project/story.html", "data": "project/story.md"}, {"name": "ui-quest-draft", "kind": "设计资料", "play": "project/ui-quest-draft.html", "data": "project/ui-quest-draft.md"}, {"name": "v12-alla-turca", "kind": "设计资料", "play": "project/v12-alla-turca.html", "data": "project/v12-alla-turca.md"}, {"name": "v12-family-cards", "kind": "设计资料", "play": "project/v12-family-cards.html", "data": "project/v12-family-cards.md"}, {"name": "v12-notebook", "kind": "设计资料", "play": "project/v12-notebook.html", "data": "project/v12-notebook.md"}, {"name": "v13-collection", "kind": "设计资料", "play": "project/v13-collection.html", "data": "project/v13-collection.md"}, {"name": "v13-quest-continuations", "kind": "设计资料", "play": "project/v13-quest-continuations.html", "data": "project/v13-quest-continuations.md"}, {"name": "v13-shop-staff", "kind": "设计资料", "play": "project/v13-shop-staff.html", "data": "project/v13-shop-staff.md"}, {"name": "v14-shop-and-turca", "kind": "设计资料", "play": "project/v14-shop-and-turca.html", "data": "project/v14-shop-and-turca.md"}, {"name": "v15-star-map", "kind": "设计资料", "play": "project/v15-star-map.html", "data": "project/v15-star-map.md"}, {"name": "v16-house-rehearsal", "kind": "设计资料", "play": "project/v16-house-rehearsal.html", "data": "project/v16-house-rehearsal.md"}, {"name": "v17-house-rehearsal", "kind": "设计资料", "play": "project/v17-house-rehearsal.html", "data": "project/v17-house-rehearsal.md"}, {"name": "v4-review", "kind": "设计资料", "play": "project/v4-review.html", "data": "project/v4-review.md"}, {"name": "v6-review", "kind": "设计资料", "play": "project/v6-review.html", "data": "project/v6-review.md"}, {"name": "v7-review", "kind": "设计资料", "play": "project/v7-review.html", "data": "project/v7-review.md"}, {"name": "v9-action-points", "kind": "设计资料", "play": "project/v9-action-points.html", "data": "project/v9-action-points.md"}, {"name": "v9-narrative", "kind": "设计资料", "play": "project/v9-narrative.html", "data": "project/v9-narrative.md"}];
const el=id=>document.getElementById(id);
function show(){
 const query=el('query').value.trim().toLowerCase(), kind=el('kind').value;
 const matches=rows.filter(r=>(kind==='全部'||r.kind===kind)&&[r.name,r.play].some(v=>v.toLowerCase().includes(query)));
 el('count').textContent=matches.length+' 项';
 el('cards').replaceChildren(...matches.map(r=>{
  const card=document.createElement('article');card.className='card';
  const category=document.createElement('small');category.textContent=r.kind;
  const title=document.createElement('h2');title.textContent=r.name;
  const links=document.createElement('div');links.className='links';
  for(const [label,url] of [[r.kind==='设计资料'?'查看':'打开试玩',r.play],['预设模式',r.alt],['Windows 包',r.zip],['源文件',r.data]]){
   if(!url)continue;
   const link=document.createElement('a');link.href=url;link.textContent=label;links.append(link);
  }
  card.append(category,title,links);return card;
 }));
}
el('query').addEventListener('input',show);el('kind').addEventListener('change',show);show();
const key='collector-playtest-notes';
try{el('notes').value=localStorage.getItem(key)||'';}catch{}
el('notes').addEventListener('input',()=>{try{localStorage.setItem(key,el('notes').value);el('note-status').textContent='已保存';}catch{el('note-status').textContent='请导出以保留笔记';}});
el('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([el('notes').value],{type:'text/plain;charset=utf-8'}));a.download='collector-playtest-notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
</script></body></html>
